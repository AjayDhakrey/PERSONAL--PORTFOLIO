[build]
  publish = "index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/AJAY-DHAKREY-MERN-STACK-DEVELOPER.pdf"
  [headers.values]
    Content-Type = "application/pdf"
